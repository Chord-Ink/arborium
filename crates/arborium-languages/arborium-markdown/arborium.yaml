repo: https://github.com/tree-sitter-grammars/tree-sitter-markdown
commit: a0a00f817d02412bd92c54d316f164d827b57b5c
license: MIT

grammars:
  - id: markdown
    name: Markdown
    tag: markup
    tier: 2
    has_scanner: true
    icon: simple-icons:markdown
    aliases:
      - md
      - mdx

    injections:
      - markdown_inline
      - html
      - yaml
      - toml

    inventor: John Gruber and Aaron Swartz
    year: 2004
    description: "Lightweight markup language for plain-text formatting; original spec on <a href=\"https://daringfireball.net/projects/markdown/\">Gruber's site</a>."
    link: https://en.wikipedia.org/wiki/Markdown
    trivia: "Gruber published Markdown 1.0 with Swartz as beta tester in 2004; the canonical description and reference implementation are on <a href=\"https://daringfireball.net/projects/markdown/\">Gruber's site</a>."

    samples:
      - path: samples/rust-readme.md
        description: Rust language README with headings, lists, links, images, and code fences.
        link: https://github.com/rust-lang/rust/blob/master/README.md
        license: Apache-2.0
