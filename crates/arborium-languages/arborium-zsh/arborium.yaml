grammars:
  - id: zsh
    name: Zsh
    tag: shell
    tier: 3
    has_scanner: true
    icon: mdi:console

    inventor: Paul Falstad
    year: 1990
    description: "Extended Unix shell with rich scripting; reference manual at <a href=\"https://zsh.sourceforge.io/Doc/\">zsh.sourceforge.io</a>."
    link: https://en.wikipedia.org/wiki/Z_shell
    trivia: "Created by Falstad while at Princeton; named after TA Zhong Shao. The <a href=\"https://zsh.sourceforge.io/FAQ/\">Zsh FAQ</a> documents its history and feature set."

    samples:
      - path: samples/git.plugin.zsh
        description: oh-my-zsh git plugin with aliases, functions, and completions.
        link: https://github.com/ohmyzsh/ohmyzsh/blob/master/plugins/git/git.plugin.zsh
        license: MIT
