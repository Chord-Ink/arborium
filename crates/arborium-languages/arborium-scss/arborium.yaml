repo: https://github.com/tree-sitter-grammars/tree-sitter-scss
commit: 2ef6d42e3ad7a8208900f9346f4529806ae0f9f9
license: MIT

grammars:
  - id: scss
    name: SCSS
    tag: markup
    tier: 3
    has_scanner: true
    icon: simple-icons:sass
    aliases:
      - sass

    dependencies:
      - npm: tree-sitter-css
        crate: arborium-css

    queries:
      highlights:
        prepend:
          - crate: arborium-css

    inventor: Hampton Catlin, Natalie Weizenbaum, Chris Eppstein
    year: 2006
    description: "Sass/SCSS is a CSS superset adding variables, nesting, and mixins; see the official <a href=\"https://sass-lang.com/documentation/\">documentation</a>."
    link: https://en.wikipedia.org/wiki/Sass_(style_sheet_language)
    trivia: "SCSS syntax arrived with Sass 3 (2010) to mirror CSS; history and design notes are in the <a href=\"https://sass-lang.com/blog/\">Sass blog</a> and <a href=\"https://sass-lang.com/documentation/syntax\">syntax documentation</a>."

    samples:
      - path: samples/_buttons.scss
        description: Bootstrap buttons partial with variables, mixins, nesting, and interpolation.
        link: https://github.com/twbs/bootstrap/blob/main/scss/_buttons.scss
        license: MIT
